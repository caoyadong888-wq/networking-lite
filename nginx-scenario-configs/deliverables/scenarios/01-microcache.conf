# Microcache an anonymous GET for a few seconds.
# 微缓存：匿名 GET 只缓存几秒，带登录态的请求不进缓存。
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx-scenario.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    access_log /var/log/nginx/access.log combined;

    proxy_cache_path /var/cache/nginx/micro levels=1:2 keys_zone=microcache:20m
                     max_size=500m inactive=20m use_temp_path=off;

    map $http_cookie $skip_cookie {
        default 0;
        "~*session" 1;
    }

    map $http_authorization $skip_auth {
        default 0;
        "~." 1;
    }

    upstream origin_app {
        server 192.0.2.10:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name cache.example.com;

        location / {
            proxy_pass http://origin_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_cache microcache;
            proxy_cache_methods GET HEAD;
            proxy_cache_key $scheme$host$request_uri;
            proxy_cache_valid 200 30s;
            proxy_cache_valid 301 302 10s;
            proxy_cache_valid 404 5s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_bypass $skip_cookie $skip_auth $arg_nocache;
            proxy_no_cache $skip_cookie $skip_auth $arg_nocache;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
