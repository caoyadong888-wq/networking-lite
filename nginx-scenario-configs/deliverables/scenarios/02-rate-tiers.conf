# Three request budgets and two connection budgets.
# 三档请求配额、两档连接配额：登录最严，匿名次之，已登录最宽。
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx-scenario.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    access_log /var/log/nginx/access.log combined;

    map $cookie_session $client_tier {
        default anon;
        "~.+" member;
    }

    limit_req_zone $binary_remote_addr zone=anon:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=member:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=conn_anon:10m;
    limit_conn_zone $binary_remote_addr zone=conn_member:10m;
    limit_conn_zone $binary_remote_addr zone=conn_login:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream app_upstream {
        server 192.0.2.11:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name app.example.com;

        location /login/ {
            limit_req zone=login burst=3 nodelay;
            limit_conn conn_login 5;
            proxy_pass http://app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            error_page 418 = @member;
            if ($client_tier = "member") {
                return 418;
            }
            limit_req zone=anon burst=20 nodelay;
            limit_conn conn_anon 20;
            proxy_pass http://app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location @member {
            limit_req zone=member burst=80 nodelay;
            limit_conn conn_member 80;
            proxy_pass http://app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
