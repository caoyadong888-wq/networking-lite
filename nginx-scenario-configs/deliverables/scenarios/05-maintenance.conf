# Maintenance flag. Staff cookie and /healthz stay up.
# 维护开关：标志文件存在时返回 503，值班 cookie 和 /healthz 除外。
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx-scenario.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    access_log /var/log/nginx/access.log combined;

    upstream app_upstream {
        server 192.0.2.22:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name www.example.com;

        set $maint 0;
        if (-f /etc/nginx/maintenance.flag) {
            set $maint 1;
        }
        if ($cookie_maint_bypass = "office-staff-preview") {
            set $maint 0;
        }
        if ($uri = /healthz) {
            set $maint 0;
        }
        if ($maint = 1) {
            return 503;
        }

        error_page 503 @maintenance;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location @maintenance {
            internal;
            root /usr/share/nginx/html;
            try_files /maintenance.html =503;
            add_header Retry-After 3600 always;
            add_header Cache-Control "no-store" always;
        }
    }
}
