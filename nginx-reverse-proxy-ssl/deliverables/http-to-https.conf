# HTTP to HTTPS redirect that still serves the ACME http-01 challenge.
# The challenge location is a prefix match (^~) so it wins over the redirect.

server {
    listen 80;
    server_name app.example.com www.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
